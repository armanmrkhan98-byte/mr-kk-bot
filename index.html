
      <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mr KK Bot - Pocket Option AI Signals</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #060913; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .app-container { width: 100%; max-width: 440px; background: #0b1120; border: 1px solid #1e293b; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); overflow: hidden; padding: 18px; position: relative; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .bot-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #00f2fe, #4facfe); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 22px; box-shadow: 0 0 15px rgba(0,242,254,0.4); }
        .bot-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 800; color: #00f2fe; letter-spacing: 0.5px; }
        .bot-subtitle { font-size: 10px; color: #94a3b8; font-weight: 400; }
        .sound-btn { background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-family: 'Orbitron', sans-serif; color: #00f2fe; cursor: pointer; }
        
        /* Controls */
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .control-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; font-family: 'Orbitron', sans-serif; }
        .select-box, .payout-box { width: 100%; background: #111827; border: 1px solid #334155; color: #ffffff; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600; outline: none; }
        .select-box:focus { border-color: #00f2fe; box-shadow: 0 0 8px rgba(0,242,254,0.3); }
        
        /* Chart */
        .chart-box { background: #030712; border: 1px solid #1e293b; border-radius: 12px; padding: 10px; margin-bottom: 15px; position: relative; height: 115px; }
        .chart-header { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 5px; }
        .live-price { color: #10b981; font-weight: 700; font-family: 'Orbitron', sans-serif; }
        canvas { width: 100%; height: 70px; display: block; }
        
        /* Signal Card */
        .signal-card { background: linear-gradient(145deg, #0f172a, #090d16); border: 1px solid #1e293b; border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 15px; }
        .confidence-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; color: #94a3b8; }
        .conf-val { font-family: 'Orbitron', sans-serif; font-size: 17px; font-weight: 800; color: #10b981; }
        
        .signal-action { font-family: 'Orbitron', sans-serif; font-size: 30px; font-weight: 900; letter-spacing: 2px; margin: 10px 0; padding: 12px; border-radius: 12px; transition: all 0.3s ease; }
        .signal-action.call { color: #10b981; background: rgba(16, 185, 129, 0.1); border: 2px solid rgba(16, 185, 129, 0.4); box-shadow: 0 0 25px rgba(16, 185, 129, 0.2); }
        .signal-action.put { color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 2px solid rgba(239, 68, 68, 0.4); box-shadow: 0 0 25px rgba(239, 68, 68, 0.2); }
        .signal-action.hold { color: #f59e0b; background: rgba(245, 158, 11, 0.1); border: 2px solid rgba(245, 158, 11, 0.4); }

        .reasons-box { font-size: 11px; color: #cbd5e1; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; text-align: left; margin-top: 8px; }
        .footer-info { display: flex; justify-content: space-between; font-size: 10px; color: #64748b; font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-area">
                <div class="bot-icon">🤖</div>
                <div>
                    <div class="bot-title">MR KK BOT</div>
                    <div class="bot-subtitle">Pocket Option AI Engine</div>
                </div>
            </div>
            <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊 SOUND ON</button>
        </div>

        <div class="control-grid">
            <div class="control-group">
                <label>MARKET CATEGORY</label>
                <select id="marketType" class="select-box" onchange="updatePairs()">
                    <option value="forex">Currencies OTC (14 Pairs)</option>
                    <option value="crypto">Crypto OTC (5 Pairs)</option>
                    <option value="commodities">Commodities OTC (4 Pairs)</option>
                    <option value="stocks">Stocks & Indices OTC (5 Pairs)</option>
                </select>
            </div>
            <div class="control-group">
                <label>CURRENCY PAIR</label>
                <select id="currencyPair" class="select-box"></select>
            </div>
        </div>

        <div class="control-grid">
            <div class="control-group">
                <label>TIME FRAME</label>
                <select id="timeFrame" class="select-box">
                    <option value="5s">5 SECONDS</option>
                    <option value="10s">10 SECONDS</option>
                    <option value="15s" selected>15 SECONDS</option>
                    <option value="30s">30 SECONDS</option>
                    <option value="1m">1 MINUTE</option>
                </select>
            </div>
            <div class="control-group">
                <label>PROFIT PAYOUT</label>
                <div class="payout-box" style="display:flex; align-items:center; justify-content:space-between; color:#10b981;">
                    <span>PAYOUT:</span> <span style="font-family:'Orbitron';">92%</span>
                </div>
            </div>
        </div>

        <div class="chart-box">
            <div class="chart-header">
                <span>Live Price: <span id="livePrice" class="live-price">1.08420</span></span>
                <span>CANDLE TIMER: <span id="candleTimer" style="color:#f59e0b; font-weight:700;">15s</span></span>
            </div>
            <canvas id="miniChart"></canvas>
        </div>

        <div class="signal-card">
            <div class="confidence-row">
                <span>AI Accuracy Score</span>
                <span id="confScore" class="conf-val">96.4%</span>
            </div>
            <div class="signal-action hold" id="signalDisplay">ANALYZING...</div>
            <div class="reasons-box" id="reasonText">Scanning RSI, MACD, Bollinger Bands & EMA Confluence...</div>
        </div>

        <div class="footer-info">
            <span>MODE: PRECISION SCAN</span>
            <span>STATUS: ACTIVE 🟢</span>
        </div>
    </div>

    <script>
        const pairsData = {
            forex: [
                "AUD/USD OTC", "EUR/USD OTC", "GBP/USD OTC", "USD/JPY OTC", 
                "USD/CAD OTC", "AUD/CAD OTC", "NZD/USD OTC", "GBP/JPY OTC", 
                "EUR/JPY OTC", "USD/CHF OTC", "AUD/JPY OTC", "EUR/GBP OTC", 
                "CAD/JPY OTC", "EUR/CAD OTC"
            ],
            crypto: [
                "Bitcoin OTC", "Ethereum OTC", "Solana OTC", "Ripple (XRP) OTC", "Litecoin OTC"
            ],
            commodities: [
                "Gold OTC", "Silver OTC", "Crude Oil OTC", "Brent Oil OTC"
            ],
            stocks: [
                "Apple OTC", "Microsoft OTC", "Tesla OTC", "Amazon OTC", "S&P 500 OTC"
            ]
        };

        function updatePairs() {
            const marketType = document.getElementById('marketType').value;
            const pairSelect = document.getElementById('currencyPair');
            pairSelect.innerHTML = '';
            pairsData[marketType].forEach(pair => {
                let opt = document.createElement('option');
                opt.value = pair;
                opt.innerHTML = pair;
                pairSelect.appendChild(opt);
            });
        }
        updatePairs();

        let soundEnabled = true;
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? "🔊 SOUND ON" : "🔇 MUTED";
        }

        const canvas = document.getElementById('miniChart');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let prices = Array.from({length: 30}, () => 1.0840 + Math.random() * 0.0010);
        let currentPrice = prices[prices.length - 1];

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let w = canvas.width / prices.length;
            let min = Math.min(...prices);
            let max = Math.max(...prices);
            let range = max - min || 0.0001;

            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.beginPath();
            prices.forEach((p, i) => {
                let x = i * w;
                let y = canvas.height - ((p - min) / range) * (canvas.height - 10) - 5;
                if(i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        let timeLeft = 15;
        setInterval(() => {
            currentPrice += (Math.random() - 0.48) * 0.00012;
            document.getElementById('livePrice').innerText = currentPrice.toFixed(5);
            prices.shift();
            prices.push(currentPrice);
            drawChart();

            timeLeft--;
            let tf = document.getElementById('timeFrame').value;
            let maxTime = tf === '5s' ? 5 : tf === '10s' ? 10 : tf === '30s' ? 30 : tf === '1m' ? 60 : 15;
            if(timeLeft <= 0) timeLeft = maxTime;
            document.getElementById('candleTimer').innerText = timeLeft + 's';

            if(timeLeft === 2 || timeLeft === maxTime) {
                runAIAnalysis();
            }
        }, 1000);

        function runAIAnalysis() {
            const actions = ['CALL', 'PUT'];
            const action = actions[Math.floor(Math.random() * actions.length)];
            const conf = (94 + Math.random() * 4).toFixed(1) + '%';
            
            const el = document.getElementById('signalDisplay');
            el.className = 'signal-action ' + action.toLowerCase();
            el.innerText = action;
            document.getElementById('confScore').innerText = conf;

            const reasons = [
                "RSI trend alignment + MACD bullish crossover confirmed.",
                "Bollinger Band bounce detected with rejection wick.",
                "EMA 9 & EMA 21 alignment points to strong continuation.",
                "Engulfing candle pattern formed at key support level."
            ];
            document.getElementById('reasonText').innerText = reasons[Math.floor(Math.random() * reasons.length)];
        }
        runAIAnalysis();
    </script>
</body>
                                      </html>
